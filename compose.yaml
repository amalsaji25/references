services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lingua
      POSTGRES_USER: lingua
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingua -d lingua"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/lingua
      DATABASE_USER: lingua
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:-}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
